<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Poster Shiruba</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            background: #0f0f1a;
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        
        /* Poster */
        .poster {
            width: 100%;
            max-width: 400px;
            aspect-ratio: 9 / 16;
            background: linear-gradient(135deg, #6ba3ff, #a3c4ff, #e0ebff);
            border-radius: 30px;
            padding: 40px 30px;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: 0 30px 80px rgba(100, 150, 255, 0.4);
        }
        
        /* Elemen dekoratif */
        .poster::before {
            content: "";
            position: absolute;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(255,255,255,0.4), transparent 70%);
            border-radius: 50%;
            top: -100px;
            right: -100px;
        }
        
        .poster::after {
            content: "";
            position: absolute;
            width: 200px;
            height: 200px;
            background: radial-gradient(circle, rgba(255,255,255,0.3), transparent 70%);
            border-radius: 50%;
            bottom: -50px;
            left: -50px;
        }
        
        /* Header poster */
        .header {
            position: relative;
            z-index: 2;
            text-align: center;
        }
        
        .header .logo {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            border: 3px solid #ffffff;
            object-fit: cover;
            margin-bottom: 15px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.15);
        }
        
        .header h1 {
            font-size: 32px;
            color: #ffffff;
            letter-spacing: 6px;
            font-weight: 700;
            text-shadow: 0 4px 15px rgba(0,0,0,0.15);
        }
        
        .header p {
            font-size: 12px;
            color: rgba(255,255,255,0.9);
            letter-spacing: 3px;
            margin-top: 5px;
            font-weight: 500;
        }
        
        /* Mockup UI */
        .mockup {
            position: relative;
            z-index: 2;
            background: #ffffff;
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.2);
            transform: perspective(1000px) rotateX(5deg);
            margin: 20px 0;
        }
        
        .mockup-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 15px;
        }
        
        .mockup-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #ff6b6b;
        }
        
        .mockup-dot:nth-child(2) { background: #ffd93d; }
        .mockup-dot:nth-child(3) { background: #6bcf7f; }
        
        .mockup-content {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        
        .mockup-bar {
            height: 10px;
            background: #f0f5ff;
            border-radius: 5px;
        }
        
        .mockup-bar:nth-child(1) { width: 60%; background: #6ba3ff; }
        .mockup-bar:nth-child(2) { width: 80%; }
        .mockup-bar:nth-child(3) { width: 45%; }
        .mockup-bar:nth-child(4) { width: 70%; }
        
        .mockup-card {
            background: linear-gradient(135deg, #6ba3ff, #a3c4ff);
            border-radius: 12px;
            padding: 15px;
            margin-top: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .mockup-card-icon {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: rgba(255,255,255,0.3);
        }
        
        .mockup-card-text {
            flex: 1;
        }
        
        .mockup-card-text div {
            height: 8px;
            background: rgba(255,255,255,0.5);
            border-radius: 4px;
            margin-bottom: 5px;
        }
        
        .mockup-card-text div:last-child {
            width: 60%;
            margin-bottom: 0;
        }
        
        /* Footer poster */
        .footer {
            position: relative;
            z-index: 2;
            text-align: center;
        }
        
        .footer .tagline {
            font-size: 14px;
            color: #ffffff;
            font-weight: 600;
            margin-bottom: 10px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.15);
        }
        
        .footer .kontak {
            font-size: 11px;
            color: rgba(255,255,255,0.85);
            letter-spacing: 1px;
        }
        
        .footer .harga {
            display: inline-block;
            background: rgba(255,255,255,0.25);
            backdrop-filter: blur(10px);
            color: #ffffff;
            font-size: 12px;
            font-weight: 700;
            padding: 8px 16px;
            border-radius: 20px;
            margin-top: 10px;
            border: 1px solid rgba(255,255,255,0.4);
        }
    </style>
</head>
<body>
    <div class="poster">
        <!-- Header -->
        <div class="header">
            <img src="https://i.supaimg.com/e8bb1d11-ea2c-4e76-9d0e-43c7041f2fd1/389729b8-7ffd-46c2-a7af-b8b646ce1b2c.jpg" class="logo" alt="Shiruba">
            <h1>SHIRUBA</h1>
            <p>DIGITAL ART & DESIGN</p>
        </div>
        
        <!-- Mockup UI -->
        <div class="mockup">
            <div class="mockup-header">
                <div class="mockup-dot"></div>
                <div class="mockup-dot"></div>
                <div class="mockup-dot"></div>
            </div>
            <div class="mockup-content">
                <div class="mockup-bar"></div>
                <div class="mockup-bar"></div>
                <div class="mockup-bar"></div>
                <div class="mockup-card">
                    <div class="mockup-card-icon"></div>
                    <div class="mockup-card-text">
                        <div></div>
                        <div></div>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- Footer -->
        <div class="footer">
            <div class="tagline">Jasa Desain Logo Custom</div>
            <div class="kontak">📱 0831-8920-0985</div>
            <div class="harga">Mulai Rp 5.000</div>
        </div>
    </div>
</body>
</html>
